<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Our Services - WebNest Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:var(--dark); }

    /* PAGE HERO */
    .page-hero {
      background:var(--sky); padding:5rem var(--pm) 4rem;
      border-bottom:4px solid var(--cream);
    }
    .page-hero-label { color:rgba(255,255,247,.6); margin-bottom:.75rem; }
    .page-hero h1 {
      font-family:'Bebas Neue',sans-serif; font-weight:400;
      font-size:clamp(4rem,10vw,10rem); line-height:.85;
      letter-spacing:-.02em; text-transform:uppercase; color:var(--cream);
    }

    /* SERVICES SPLIT (matches screenshot: image left, dark list right) */
    .svc-split {
      display:grid; grid-template-columns:38% 1fr;
      min-height:calc(100dvh - var(--hh) - 200px);
    }
    @media(max-width:768px){ .svc-split { grid-template-columns:1fr; } }
    .svc-photo { position:relative; overflow:hidden; }
    .svc-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .svc-list-panel {
      background:var(--panel); padding:3.5rem 3rem;
      display:flex; flex-direction:column; justify-content:center;
    }
    .svc-list-label {
      font:600 .7rem/1 'Space Grotesk',sans-serif; text-transform:uppercase;
      letter-spacing:.12em; color:rgba(255,255,247,.4); margin-bottom:2.5rem;
    }
    .svc-list { list-style:none; }
    .svc-list li { border-bottom:1px solid rgba(255,255,247,.07); }
    .svc-list a {
      display:flex; align-items:center; justify-content:space-between;
      padding:1.35rem 0;
      font:700 clamp(1.1rem,2.5vw,1.6rem)/1.1 'Space Grotesk',sans-serif;
      text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,247,.72);
      transition:color .25s, padding-left .25s;
    }
    .svc-list a:hover, .svc-list a.active {
      color:var(--lime); padding-left:.5rem;
    }
    .svc-list a span {
      font-size:.75rem; opacity:0; transition:opacity .25s;
    }
    .svc-list a:hover span, .svc-list a.active span { opacity:1; }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="header-brand">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="#cdfb52"/>
        <path d="M5 8L9 19L14 10L19 19L23 8" stroke="#1c1616" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      WebNest
    </a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="index.html"    class="nav-link">Home</a>
      <a href="services.html" class="nav-link active">Our Services</a>
      <a href="contact.html"  class="nav-link">Contact Us</a>
    </nav>
  </header>

  <div class="page-hero">
    <p class="page-hero-label t-cap">What we do</p>
    <h1>Our<br>Services</h1>
  </div>

  <!-- Screenshot-style split: photo left, dark list right -->
  <div class="svc-split">
    <div class="svc-photo">
      <img src="https://picsum.photos/seed/wn-services-desk/600/900" alt="WebNest Studio workspace" loading="lazy">
    </div>
    <div class="svc-list-panel">
      <p class="svc-list-label">Select a service</p>
      <ul class="svc-list" role="list">
        <li><a href="services/web-design.html">Website Development <span>&rarr;</span></a></li>
        <li><a href="services/photography.html">Professional Photography <span>&rarr;</span></a></li>
        <li><a href="services/social-media.html">Social Media Launch <span>&rarr;</span></a></li>
        <li><a href="services/videography.html">Videography <span>&rarr;</span></a></li>
        <li><a href="services/maintenance.html">Website Maintenance <span>&rarr;</span></a></li>
      </ul>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-brand">WebNest Studio</div>
    <ul class="footer-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <p class="footer-copy">&copy; <span class="yr"></span> WebNest Studio</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
